# Cấu hình Nginx cho ứng dụng ReactJS
# Xử lý đúng React Router (Không bị lỗi 404 khi F5 trên các trang con)

server {
    # Lắng nghe trên cổng 80
    listen 80;
    server_name localhost;

    # Thư mục chứa các file HTML/CSS/JS đã build
    root /usr/share/nginx/html;
    index index.html;

    # Xử lý React Router: Mọi đường dẫn đều trả về index.html
    # React sẽ tự xử lý điều hướng nội bộ (/dashboard, /dean...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình cache cho các file tĩnh (CSS, JS, ảnh)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Chuyển tiếp các yêu cầu API tới Backend
    # (Giúp tránh lỗi CORS khi Frontend và Backend khác cổng)
    location /api/ {
        proxy_pass http://backend:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
