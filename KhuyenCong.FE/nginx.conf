# Cấu hình Nginx cho ứng dụng ReactJS
# Xử lý đúng React Router (Không bị lỗi 404 khi F5 trên các trang con)

server {
    # Lắng nghe trên cổng 80
    listen 80;
    server_name localhost;

    # Cho phép upload file lớn (giải quyết lỗi 413 Payload Too Large)
    client_max_body_size 50M;

    # Thư mục chứa các file HTML/CSS/JS đã build
    root /usr/share/nginx/html;
    index index.html;

    # ================================================================
    # QUAN TRỌNG: Dùng ^~ để block /api/ luôn được ưu tiên cao hơn
    # block regex ~* bên dưới. Nếu không, các URL /api/file/download/abc.jpg
    # sẽ bị nginx nhận diện là file tĩnh .jpg và trả về 404 thay vì
    # chuyển tiếp đến Backend.
    # ================================================================
    location ^~ /api/ {
        proxy_pass http://backend:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tắt buffer để hỗ trợ streaming file lớn
        proxy_buffering off;
        # Tăng timeout cho file upload lớn
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Cấu hình cache cho các file tĩnh (CSS, JS, ảnh của React App)
    # Block này chỉ áp dụng cho file tĩnh trong /usr/share/nginx/html/
    # KHÔNG áp dụng cho /api/ vì ^~ ở trên có ưu tiên cao hơn regex ~*
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Xử lý React Router: Mọi đường dẫn đều trả về index.html
    # React sẽ tự xử lý điều hướng nội bộ (/dashboard, /dean...)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}
