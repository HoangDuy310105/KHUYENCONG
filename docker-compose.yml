# =================================================================
# DOCKER COMPOSE — HỆ THỐNG QUẢN LÝ KHUYẾN CÔNG
# Điều phối 4 container: PostgreSQL + Redis + Backend + Frontend
# Lệnh chạy: docker-compose up --build
# =================================================================

services:

  # ---------------------------------------------------------------
  # SERVICE 1: CƠ SỞ DỮ LIỆU POSTGRESQL
  # Khởi động đầu tiên, các service khác phải chờ service này sẵn sàng
  # ---------------------------------------------------------------
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: khuyencong_postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: KhuyenCongDB
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: "123456"
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - khuyencong_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d KhuyenCongDB"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ---------------------------------------------------------------
  # SERVICE 2: REDIS CACHE
  # Khởi động sau PostgreSQL, trước Backend
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: khuyencong_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - khuyencong_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------
  # SERVICE 2.5: MINIO STORAGE (Lưu trữ File/Ảnh)
  # ---------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: khuyencong_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # Cổng giao tiếp API
      - "9001:9001" # Cổng Console quản trị (Giao diện Web)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - khuyencong_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------------
  # SERVICE 3: BACKEND .NET 10 API
  # Chỉ khởi động sau khi Redis đã sẵn sàng
  # ---------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khuyencong_backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      # Kết nối tới Database Postgres của pgAdmin trên máy host Windows (dùng host.docker.internal)
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=KhuyenCongDB;Username=postgres;Password=123456;
      - ConnectionStrings__RedisConnection=redis:6379
      # Ghi đè JWT Settings
      - JwtSettings__SecretKey=KhuyenCong_SecretKey_ChinhThuc_Phai_Lon_Hon_256_Bits_De_Ma_Hoa
      - JwtSettings__Issuer=KhuyenCongAPI
      - JwtSettings__Audience=KhuyenCongSPA
      - JwtSettings__ExpiryMinutes=60
      - ASPNETCORE_ENVIRONMENT=Production
      - MinioSettings__Endpoint=minio:9000
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - khuyencong_network

  # ---------------------------------------------------------------
  # SERVICE 3: FRONTEND REACTJS + NGINX
  # Khởi động sau cùng, phục vụ giao diện cho người dùng
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./KhuyenCong.FE
      dockerfile: Dockerfile
    container_name: khuyencong_frontend
    restart: unless-stopped
    ports:
      # Truy cập tại: http://localhost
      - "80:80"
    depends_on:
      - backend
    networks:
      - khuyencong_network

# =================================================================
# VOLUMES — Lưu trữ dữ liệu bền vững
# =================================================================
volumes:
  postgres_data:
    name: khuyencong_postgres_data
  redis_data:
    name: khuyencong_redis_data
  minio_data:
    name: khuyencong_minio_data

# =================================================================
# NETWORKS — Mạng nội bộ để các container giao tiếp với nhau
# =================================================================
networks:
  khuyencong_network:
    name: khuyencong_network
    driver: bridge
